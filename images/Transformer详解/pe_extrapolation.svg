<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="880" height="460" fill="#2d333b"/>
  <text x="440" y="30" text-anchor="middle" fill="#cdd9e5" font-size="16" font-weight="bold">训练长度 vs 推理长度：外推能力对比</text>

  <g transform="translate(60,70)">
    <line x1="0" y1="280" x2="760" y2="280" stroke="#636e7b" stroke-width="1"/>
    <line x1="0" y1="20" x2="0" y2="280" stroke="#636e7b" stroke-width="1"/>
    <text x="-10" y="285" text-anchor="end" fill="#768390" font-size="11">差</text>
    <text x="-10" y="25" text-anchor="end" fill="#768390" font-size="11">好</text>
    <text x="380" y="320" text-anchor="middle" fill="#adbac7">序列位置 pos →</text>

    <line x1="380" y1="20" x2="380" y2="280" stroke="#f0883e" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="380" y="15" text-anchor="middle" fill="#f0883e" font-size="11">训练长度上限 N=512</text>

    <text x="100" y="60" fill="#3fb950" font-size="12">三条曲线：相同训练长度，不同位置编码</text>

    <path d="M 0 80 L 380 90 L 760 240" fill="none" stroke="#a371f7" stroke-width="2"/>
    <text x="780" y="240" fill="#a371f7" font-size="12">可学习位置（崖式崩）</text>

    <path d="M 0 90 L 380 95 L 760 130" fill="none" stroke="#388bfd" stroke-width="2"/>
    <text x="780" y="130" fill="#388bfd" font-size="12">sin / cos（缓慢退化）</text>

    <path d="M 0 95 L 380 100 L 760 110" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="780" y="110" fill="#3fb950" font-size="12">RoPE / ALiBi（外推友好）</text>
  </g>

  <text x="440" y="420" text-anchor="middle" fill="#768390" font-size="11">示意趋势：可学习位置在训练长度外瞬间「未见过」，正弦平滑外推但效果仍下滑，相对位置编码最稳。</text>
  <text x="440" y="440" text-anchor="middle" fill="#768390" font-size="11">具体差距随模型 / 任务变动；本图来源是定性描述，不是测量数据。</text>
</svg>
