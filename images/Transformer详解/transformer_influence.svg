    <text x="560" y="98" text-anchor="middle" fill="#388bfd">解码器路线</text>
    <text x="560" y="114" text-anchor="middle">GPT 系列, LLaMA</text>

    <line x1="455" y1="230" x2="640" y2="230" stroke="#a371f7"/>
