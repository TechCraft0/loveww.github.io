<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .bg { fill: #2d333b; }
      .text-main { fill: #cdd9e5; font-size: 14px; }
      .text-small { fill: #adbac7; font-size: 12px; }
      .text-tiny { fill: #768390; font-size: 11px; }
      .box { fill: none; stroke: #388bfd; stroke-width: 2; }
      .box-green { fill: none; stroke: #3fb950; stroke-width: 2; }
      .box-orange { fill: none; stroke: #f0883e; stroke-width: 2; }
      .box-purple { fill: none; stroke: #a371f7; stroke-width: 2; }
      .arrow { stroke: #768390; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-thick { stroke: #388bfd; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-green { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#768390" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#388bfd" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3fb950" />
    </marker>
  </defs>
  
  <rect class="bg" width="900" height="700"/>
  
  <!-- Title -->
  <text class="text-main" x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Cross-Attention 数据流</text>
  <text class="text-small" x="450" y="55" text-anchor="middle">Decoder 用 Q 检索 Encoder 输出（K/V）</text>
  
  <!-- Left: Encoder side -->
  <g transform="translate(50, 100)">
    <text class="text-main" x="150" y="0" text-anchor="middle" font-weight="bold">Encoder 输出</text>
    
    <rect class="box" x="50" y="20" width="200" height="150" rx="6"/>
    <text class="text-small" x="150" y="50" text-anchor="middle">源端序列编码</text>
    
    <!-- Token representations -->
    <rect class="box-orange" x="70" y="70" width="160" height="30" rx="3"/>
    <text class="text-tiny" x="150" y="90" text-anchor="middle">h_enc[0]: "The"</text>
    
    <rect class="box-orange" x="70" y="105" width="160" height="30" rx="3"/>
    <text class="text-tiny" x="150" y="125" text-anchor="middle">h_enc[1]: "cat"</text>
    
    <rect class="box-orange" x="70" y="140" width="160" height="25" rx="3"/>
    <text class="text-tiny" x="150" y="157" text-anchor="middle">h_enc[2...N]</text>
    
    <text class="text-tiny" x="150" y="195" text-anchor="middle" fill="#768390">shape: (src_len, d_model)</text>
  </g>
  
  <!-- Right: Decoder side -->
  <g transform="translate(650, 100)">
    <text class="text-main" x="100" y="0" text-anchor="middle" font-weight="bold">Decoder 当前状态</text>
    
    <rect class="box-green" x="20" y="20" width="160" height="100" rx="6"/>
    <text class="text-small" x="100" y="50" text-anchor="middle">已生成序列</text>
    
    <rect class="box-purple" x="40" y="70" width="120" height="25" rx="3"/>
    <text class="text-tiny" x="100" y="87" text-anchor="middle">h_dec[t]: "猫"</text>
    
    <text class="text-tiny" x="100" y="135" text-anchor="middle" fill="#768390">当前解码位置 t</text>
  </g>
  
  <!-- Middle: Cross-Attention mechanism -->
  <g transform="translate(300, 300)">
    <rect class="box" x="0" y="0" width="300" height="250" rx="6"/>
    <text class="text-main" x="150" y="30" text-anchor="middle" font-weight="bold">Cross-Attention</text>
    
    <!-- Q from decoder -->
    <rect class="box-green" x="20" y="50" width="80" height="40" rx="3"/>
    <text class="text-small" x="60" y="75" text-anchor="middle">Q</text>
    <text class="text-tiny" x="60" y="105" text-anchor="middle">h_dec × W_Q</text>
    
    <!-- K from encoder -->
    <rect class="box-orange" x="110" y="50" width="80" height="40" rx="3"/>
    <text class="text-small" x="150" y="75" text-anchor="middle">K</text>
    <text class="text-tiny" x="150" y="105" text-anchor="middle">h_enc × W_K</text>
    
    <!-- V from encoder -->
    <rect class="box-orange" x="200" y="50" width="80" height="40" rx="3"/>
    <text class="text-small" x="240" y="75" text-anchor="middle">V</text>
    <text class="text-tiny" x="240" y="105" text-anchor="middle">h_enc × W_V</text>
    
    <!-- Attention formula -->
    <text class="text-small" x="150" y="140" text-anchor="middle" font-family="monospace">scores = Q · Kᵀ / √d_k</text>
    <text class="text-small" x="150" y="165" text-anchor="middle" font-family="monospace">attn = softmax(scores)</text>
    <text class="text-small" x="150" y="190" text-anchor="middle" font-family="monospace">output = attn · V</text>
    
    <text class="text-tiny" x="150" y="220" text-anchor="middle" fill="#768390">decoder 在 encoder 输出上做「信息检索」</text>
  </g>
  
  <!-- Arrows showing data flow -->
  <!-- Encoder to K/V -->
  <path class="arrow-thick" d="M 250 180 Q 300 240, 410 330"/>
  <text class="text-tiny" x="280" y="200" fill="#388bfd">K, V</text>
  
  <path class="arrow-thick" d="M 250 180 Q 320 240, 540 330"/>
  
  <!-- Decoder to Q -->
  <path class="arrow-green" d="M 650 220 Q 600 260, 360 330"/>
  <text class="text-tiny" x="580" y="240" fill="#3fb950">Q</text>
  
  <!-- Output -->
  <path class="arrow" d="M 450 550 L 450 590"/>
  <rect class="box-purple" x="380" y="590" width="140" height="40" rx="4"/>
  <text class="text-small" x="450" y="615" text-anchor="middle">融合了源端信息的</text>
  <text class="text-small" x="450" y="630" text-anchor="middle">decoder 表示</text>
  
  <!-- Explanation box at bottom -->
  <g transform="translate(50, 650)">
    <text class="text-main" x="0" y="0" font-weight="bold">关键点：</text>
    <text class="text-tiny" x="0" y="20">• Q 来自 decoder（当前要生成什么）</text>
    <text class="text-tiny" x="0" y="40">• K/V 来自 encoder（源端有什么可用信息）</text>
    <text class="text-tiny" x="0" y="60">• 这是 seq2seq 的核心：让目标端「检索」源端相关内容</text>
  </g>
  
  <g transform="translate(500, 650)">
    <text class="text-tiny" x="0" y="20">• 机器翻译：生成「猫」时，去源端找 "cat"</text>
    <text class="text-tiny" x="0" y="40">• 文摘：生成摘要词时，在原文找支撑片段</text>
    <text class="text-tiny" x="0" y="60">• decoder-only 模型没有 cross-attn（Q/K/V 都来自同一序列）</text>
  </g>
</svg>
