<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
  <rect width="880" height="480" fill="#2d333b"/>
  <text x="440" y="30" text-anchor="middle" fill="#adbac7" font-size="18" font-weight="bold">warmup_steps 的影响（示意）</text>

  <g transform="translate(70, 70)">
    <!-- Axes -->
    <line x1="0" y1="340" x2="740" y2="340" stroke="#adbac7"/>
    <line x1="0" y1="340" x2="0" y2="30" stroke="#adbac7"/>
    <text x="370" y="370" text-anchor="middle" fill="#adbac7">训练 step</text>
    <text x="-55" y="180" fill="#adbac7" transform="rotate(-90 -55 180)">训练 loss</text>

    <!-- warmup=4000 (good): smooth descent -->
    <path d="M 0,80 C 80,120 200,180 350,240 T 740,310" stroke="#3fb950" fill="none" stroke-width="2.4"/>
    <text x="600" y="295" fill="#3fb950" font-size="12">warmup=4000（论文）</text>

    <!-- warmup=0 (bad): early collapse -->
    <path d="M 0,80 L 30,60 L 60,200 L 100,300 L 200,330 L 740,335" stroke="#f85149" fill="none" stroke-width="2.4"/>
    <text x="180" y="200" fill="#f85149" font-size="12">warmup=0（崩）</text>

    <!-- warmup=400 (too short): unstable -->
    <path d="M 0,80 C 30,90 60,250 80,260 C 100,270 150,180 200,210 C 250,230 350,260 500,290 T 740,320" stroke="#f0883e" fill="none" stroke-width="2.0" stroke-dasharray="4 4"/>
    <text x="500" y="240" fill="#f0883e" font-size="12">warmup=400（不稳）</text>

    <!-- warmup=16000 (too long): slower convergence -->
    <path d="M 0,80 C 80,90 200,130 400,180 T 740,330" stroke="#a371f7" fill="none" stroke-width="2.0" stroke-dasharray="2 2"/>
    <text x="500" y="160" fill="#a371f7" font-size="12">warmup=16000（慢）</text>
  </g>

  <text x="440" y="450" text-anchor="middle" fill="#768390" font-size="12">warmup 不足 → 早期 LR 高、梯度估计差，训练崩</text>
  <text x="440" y="470" text-anchor="middle" fill="#768390" font-size="12">warmup 过长 → 收敛变慢，浪费算力</text>
</svg>
