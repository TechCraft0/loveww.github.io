<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="880" height="440" fill="#2d333b"/>
  <text x="440" y="30" text-anchor="middle" fill="#cdd9e5" font-size="16" font-weight="bold">原论文是「相加」不是「拼接」</text>

  <g>
    <text x="220" y="70" text-anchor="middle" fill="#3fb950" font-size="14">相加（add，原论文）</text>
    <rect x="80" y="90" width="280" height="50" rx="4" fill="#22272e" stroke="#388bfd"/>
    <text x="220" y="120" text-anchor="middle" fill="#adbac7">word_embed   ∈ ℝ^d_model = 512</text>
    <text x="220" y="160" text-anchor="middle" fill="#cdd9e5" font-size="20">+</text>
    <rect x="80" y="170" width="280" height="50" rx="4" fill="#22272e" stroke="#f0883e"/>
    <text x="220" y="200" text-anchor="middle" fill="#adbac7">PE(pos)        ∈ ℝ^d_model = 512</text>
    <text x="220" y="240" text-anchor="middle" fill="#cdd9e5" font-size="20">↓</text>
    <rect x="80" y="250" width="280" height="50" rx="4" fill="#1c2128" stroke="#a371f7"/>
    <text x="220" y="280" text-anchor="middle" fill="#adbac7">x          ∈ ℝ^d_model = 512</text>

    <text x="220" y="335" text-anchor="middle" fill="#adbac7">维度不变；模型可在不同子空间</text>
    <text x="220" y="355" text-anchor="middle" fill="#adbac7">分别承载语义与位置信息</text>
    <text x="220" y="395" text-anchor="middle" fill="#3fb950" font-size="12">参数量、显存、矩阵形状全部不变</text>
  </g>

  <g>
    <text x="660" y="70" text-anchor="middle" fill="#f85149" font-size="14">拼接（concat，未被采用）</text>
    <rect x="520" y="90" width="200" height="50" rx="4" fill="#22272e" stroke="#388bfd"/>
    <text x="620" y="120" text-anchor="middle" fill="#adbac7">word_embed (d-p)</text>
    <rect x="730" y="90" width="80" height="50" rx="4" fill="#22272e" stroke="#f0883e"/>
    <text x="770" y="120" text-anchor="middle" fill="#adbac7">PE (p)</text>
    <text x="660" y="170" text-anchor="middle" fill="#cdd9e5" font-size="20">↓ 拼接</text>
    <rect x="520" y="180" width="290" height="50" rx="4" fill="#1c2128" stroke="#a371f7"/>
    <text x="665" y="210" text-anchor="middle" fill="#adbac7">x ∈ ℝ^d_model</text>

    <text x="665" y="270" text-anchor="middle" fill="#adbac7">语义部分挤掉一段，</text>
    <text x="665" y="290" text-anchor="middle" fill="#adbac7">或要扩展 d_model 提升参数量</text>
    <text x="665" y="320" text-anchor="middle" fill="#f85149" font-size="12">没有「相加」那种「免费叠加」的好处</text>
    <text x="665" y="340" text-anchor="middle" fill="#f85149" font-size="12">且实际效果并不更好（论文消融）</text>
    <text x="665" y="395" text-anchor="middle" fill="#768390" font-size="11">许多读者第一次读论文都误以为是 concat</text>
  </g>
</svg>
