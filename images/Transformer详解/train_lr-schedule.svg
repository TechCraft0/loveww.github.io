<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
  <rect width="880" height="460" fill="#2d333b"/>
  <text x="440" y="30" text-anchor="middle" fill="#adbac7" font-size="18" font-weight="bold">Transformer 学习率：warmup + 1/√step 衰减</text>

  <!-- Axes -->
  <g transform="translate(80, 70)">
    <line x1="0" y1="320" x2="720" y2="320" stroke="#adbac7" stroke-width="1.2"/>
    <line x1="0" y1="320" x2="0" y2="20" stroke="#adbac7" stroke-width="1.2"/>
    <text x="360" y="350" text-anchor="middle" fill="#adbac7">step</text>
    <text x="-50" y="170" fill="#adbac7" transform="rotate(-90 -50 170)">learning rate</text>

    <!-- warmup region shading -->
    <rect x="0" y="20" width="100" height="300" fill="#a371f7" opacity="0.10"/>
    <text x="50" y="40" text-anchor="middle" fill="#a371f7" font-size="11">warmup</text>

    <!-- learning rate curve, peaking at step=4000 -->
    <!-- Peak at x=100 (mapped from step=4000), y about 50 -->
    <!-- Linear up: from (0, 320) to (100, 50) -->
    <line x1="0" y1="320" x2="100" y2="50" stroke="#3fb950" stroke-width="2.4"/>
    <!-- Decay: 1/sqrt(step). Sample points -->
    <path d="M 100,50 Q 200,100 300,140 T 500,200 T 720,250" stroke="#388bfd" fill="none" stroke-width="2.4"/>

    <!-- annotations -->
    <line x1="100" y1="50" x2="100" y2="320" stroke="#f0883e" stroke-dasharray="3 3" stroke-width="1"/>
    <circle cx="100" cy="50" r="4" fill="#f85149"/>
    <text x="115" y="55" fill="#f85149" font-size="12">peak: lr_peak ≈ d^(-0.5) · warmup^(-0.5)</text>

    <text x="105" y="335" fill="#a371f7" font-size="11">step = 4000</text>
    <text x="0" y="335" fill="#768390" font-size="10">0</text>

    <!-- Phase labels -->
    <text x="50" y="280" text-anchor="middle" fill="#3fb950" font-size="11">线性升 ∝ step</text>
    <text x="400" y="180" fill="#388bfd" font-size="11">∝ 1/√step</text>
  </g>

  <text x="440" y="430" text-anchor="middle" fill="#768390" font-size="12">公式：lr = d^(-0.5) · min(step^(-0.5), step · warmup^(-1.5))</text>
</svg>
