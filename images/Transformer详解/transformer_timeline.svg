<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="ui-monospace,monospace" font-size="12">
  <rect width="760" height="380" fill="#2d333b"/>
  <text x="380" y="28" text-anchor="middle" fill="#adbac7" font-size="16">Transformer 之前与之后的 NLP 架构时间线</text>
  <line x1="50" y1="200" x2="710" y2="200" stroke="#444c56" stroke-width="2"/>
  <g font-size="11">
    <g><circle cx="80" cy="200" r="6" fill="#768390"/><text x="80" y="225" text-anchor="middle" fill="#adbac7">2014</text><text x="80" y="180" text-anchor="middle" fill="#768390">Seq2Seq</text></g>
    <g><circle cx="160" cy="200" r="6" fill="#768390"/><text x="160" y="225" text-anchor="middle" fill="#adbac7">2015</text><text x="160" y="180" text-anchor="middle" fill="#768390">Bahdanau attn</text></g>
    <g><circle cx="240" cy="200" r="6" fill="#768390"/><text x="240" y="225" text-anchor="middle" fill="#adbac7">2016</text><text x="240" y="180" text-anchor="middle" fill="#768390">GNMT / ConvS2S</text></g>
    <g><circle cx="320" cy="200" r="9" fill="#f0883e"/><text x="320" y="245" text-anchor="middle" fill="#f0883e">2017.06</text><text x="320" y="172" text-anchor="middle" fill="#f0883e" font-size="13">Transformer</text><text x="320" y="158" text-anchor="middle" fill="#f0883e" font-size="11">Vaswani et al.</text></g>
    <g><circle cx="400" cy="200" r="6" fill="#3fb950"/><text x="400" y="225" text-anchor="middle" fill="#adbac7">2018.06</text><text x="400" y="180" text-anchor="middle" fill="#3fb950">GPT-1</text></g>
    <g><circle cx="450" cy="200" r="6" fill="#3fb950"/><text x="450" y="245" text-anchor="middle" fill="#adbac7">2018.10</text><text x="450" y="180" text-anchor="middle" fill="#3fb950">BERT</text></g>
    <g><circle cx="520" cy="200" r="6" fill="#3fb950"/><text x="520" y="225" text-anchor="middle" fill="#adbac7">2019</text><text x="520" y="180" text-anchor="middle" fill="#3fb950">GPT-2 / T5</text></g>
    <g><circle cx="590" cy="200" r="6" fill="#388bfd"/><text x="590" y="225" text-anchor="middle" fill="#adbac7">2020</text><text x="590" y="180" text-anchor="middle" fill="#388bfd">GPT-3</text></g>
    <g><circle cx="650" cy="200" r="6" fill="#a371f7"/><text x="650" y="225" text-anchor="middle" fill="#adbac7">2022</text><text x="650" y="180" text-anchor="middle" fill="#a371f7">ChatGPT</text></g>
    <g><circle cx="700" cy="200" r="6" fill="#a371f7"/><text x="700" y="245" text-anchor="middle" fill="#adbac7">2023</text><text x="700" y="180" text-anchor="middle" fill="#a371f7">GPT-4 / LLaMA</text></g>
  </g>
  <text x="180" y="320" fill="#768390" font-size="11">RNN/LSTM 主导期</text>
  <text x="180" y="338" fill="#768390" font-size="11">attention 是 RNN 的辅助机制</text>
  <text x="450" y="320" fill="#3fb950" font-size="11">Transformer 起飞</text>
  <text x="450" y="338" fill="#3fb950" font-size="11">BERT/GPT 验证 pretraining</text>
  <text x="640" y="320" fill="#a371f7" font-size="11">大模型时代</text>
  <text x="640" y="338" fill="#a371f7" font-size="11">scale + alignment</text>
  <line x1="50" y1="280" x2="320" y2="280" stroke="#768390" stroke-dasharray="3 3"/>
  <line x1="320" y1="280" x2="560" y2="280" stroke="#3fb950" stroke-dasharray="3 3"/>
  <line x1="560" y1="280" x2="710" y2="280" stroke="#a371f7" stroke-dasharray="3 3"/>
</svg>
