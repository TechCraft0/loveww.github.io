<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .bg { fill: #2d333b; }
      .text-main { fill: #cdd9e5; font-size: 14px; }
      .text-small { fill: #adbac7; font-size: 12px; }
      .text-tiny { fill: #768390; font-size: 11px; }
      .cell-allowed { fill: #3fb950; opacity: 0.3; }
      .cell-masked { fill: #f85149; opacity: 0.3; }
      .border { stroke: #768390; stroke-width: 1; }
    </style>
  </defs>
  
  <rect class="bg" width="900" height="700"/>
  
  <!-- Title -->
  <text class="text-main" x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Causal Mask（下三角 mask）</text>
  <text class="text-small" x="450" y="55" text-anchor="middle">确保位置 t 只能看到 ≤ t 的 token</text>
  
  <!-- Left: Attention Scores Matrix -->
  <text class="text-main" x="150" y="100" text-anchor="middle" font-weight="bold">Attention Scores（mask 前）</text>
  
  <g transform="translate(50, 120)">
    <!-- Column headers (Key positions) -->
    <text class="text-small" x="0" y="-5" fill="#768390">Key →</text>
    <text class="text-tiny" x="50" y="-5" text-anchor="middle">t=0</text>
    <text class="text-tiny" x="100" y="-5" text-anchor="middle">t=1</text>
    <text class="text-tiny" x="150" y="-5" text-anchor="middle">t=2</text>
    <text class="text-tiny" x="200" y="-5" text-anchor="middle">t=3</text>
    
    <!-- Row headers (Query positions) -->
    <text class="text-small" x="-30" y="10" fill="#768390">Query</text>
    <text class="text-small" x="-30" y="25" fill="#768390">↓</text>
    <text class="text-tiny" x="-20" y="30" text-anchor="end">t=0</text>
    <text class="text-tiny" x="-20" y="80" text-anchor="end">t=1</text>
    <text class="text-tiny" x="-20" y="130" text-anchor="end">t=2</text>
    <text class="text-tiny" x="-20" y="180" text-anchor="end">t=3</text>
    
    <!-- Matrix cells (4x4) -->
    <rect x="25" y="10" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="37" text-anchor="middle">0.8</text>
    
    <rect x="75" y="10" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="97.5" y="37" text-anchor="middle">0.3</text>
    
    <rect x="125" y="10" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="147.5" y="37" text-anchor="middle">0.5</text>
    
    <rect x="175" y="10" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="197.5" y="37" text-anchor="middle">0.7</text>
    
    <!-- Row 2 -->
    <rect x="25" y="60" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="87" text-anchor="middle">0.6</text>
    
    <rect x="75" y="60" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="97.5" y="87" text-anchor="middle">0.9</text>
    
    <rect x="125" y="60" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="147.5" y="87" text-anchor="middle">0.4</text>
    
    <rect x="175" y="60" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="197.5" y="87" text-anchor="middle">0.2</text>
    
    <!-- Row 3 -->
    <rect x="25" y="110" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="137" text-anchor="middle">0.4</text>
    
    <rect x="75" y="110" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="97.5" y="137" text-anchor="middle">0.7</text>
    
    <rect x="125" y="110" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="147.5" y="137" text-anchor="middle">0.8</text>
    
    <rect x="175" y="110" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="197.5" y="137" text-anchor="middle">0.6</text>
    
    <!-- Row 4 -->
    <rect x="25" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="187" text-anchor="middle">0.5</text>
    
    <rect x="75" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="97.5" y="187" text-anchor="middle">0.3</text>
    
    <rect x="125" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="147.5" y="187" text-anchor="middle">0.6</text>
    
    <rect x="175" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="197.5" y="187" text-anchor="middle">0.9</text>
  </g>
  
  <!-- Arrow -->
  <text class="text-main" x="300" y="230" font-size="24">→</text>
  <text class="text-small" x="300" y="250" text-anchor="middle">加 Causal Mask</text>
  <text class="text-tiny" x="300" y="270" text-anchor="middle">上三角 = -inf</text>
  
  <!-- Right: After Mask -->
  <text class="text-main" x="550" y="100" text-anchor="middle" font-weight="bold">Masked Scores（mask 后）</text>
  
  <g transform="translate(450, 120)">
    <!-- Column headers -->
    <text class="text-small" x="0" y="-5" fill="#768390">Key →</text>
    <text class="text-tiny" x="50" y="-5" text-anchor="middle">t=0</text>
    <text class="text-tiny" x="100" y="-5" text-anchor="middle">t=1</text>
    <text class="text-tiny" x="150" y="-5" text-anchor="middle">t=2</text>
    <text class="text-tiny" x="200" y="-5" text-anchor="middle">t=3</text>
    
    <!-- Row headers -->
    <text class="text-small" x="-30" y="10" fill="#768390">Query</text>
    <text class="text-small" x="-30" y="25" fill="#768390">↓</text>
    <text class="text-tiny" x="-20" y="30" text-anchor="end">t=0</text>
    <text class="text-tiny" x="-20" y="80" text-anchor="end">t=1</text>
    <text class="text-tiny" x="-20" y="130" text-anchor="end">t=2</text>
    <text class="text-tiny" x="-20" y="180" text-anchor="end">t=3</text>
    
    <!-- Row 1: only t=0 allowed -->
    <rect x="25" y="10" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="37" text-anchor="middle" fill="#3fb950">0.8</text>
    
    <rect x="75" y="10" width="45" height="45" class="cell-masked border"/>
    <text class="text-small" x="97.5" y="37" text-anchor="middle" fill="#f85149">-∞</text>
    
    <rect x="125" y="10" width="45" height="45" class="cell-masked border"/>
    <text class="text-small" x="147.5" y="37" text-anchor="middle" fill="#f85149">-∞</text>
    
    <rect x="175" y="10" width="45" height="45" class="cell-masked border"/>
    <text class="text-small" x="197.5" y="37" text-anchor="middle" fill="#f85149">-∞</text>
    
    <!-- Row 2: t=0,1 allowed -->
    <rect x="25" y="60" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="87" text-anchor="middle" fill="#3fb950">0.6</text>
    
    <rect x="75" y="60" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="97.5" y="87" text-anchor="middle" fill="#3fb950">0.9</text>
    
    <rect x="125" y="60" width="45" height="45" class="cell-masked border"/>
    <text class="text-small" x="147.5" y="87" text-anchor="middle" fill="#f85149">-∞</text>
    
    <rect x="175" y="60" width="45" height="45" class="cell-masked border"/>
    <text class="text-small" x="197.5" y="87" text-anchor="middle" fill="#f85149">-∞</text>
    
    <!-- Row 3: t=0,1,2 allowed -->
    <rect x="25" y="110" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="137" text-anchor="middle" fill="#3fb950">0.4</text>
    
    <rect x="75" y="110" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="97.5" y="137" text-anchor="middle" fill="#3fb950">0.7</text>
    
    <rect x="125" y="110" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="147.5" y="137" text-anchor="middle" fill="#3fb950">0.8</text>
    
    <rect x="175" y="110" width="45" height="45" class="cell-masked border"/>
    <text class="text-small" x="197.5" y="137" text-anchor="middle" fill="#f85149">-∞</text>
    
    <!-- Row 4: all allowed -->
    <rect x="25" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="47.5" y="187" text-anchor="middle" fill="#3fb950">0.5</text>
    
    <rect x="75" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="97.5" y="187" text-anchor="middle" fill="#3fb950">0.3</text>
    
    <rect x="125" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="147.5" y="187" text-anchor="middle" fill="#3fb950">0.6</text>
    
    <rect x="175" y="160" width="45" height="45" class="cell-allowed border"/>
    <text class="text-small" x="197.5" y="187" text-anchor="middle" fill="#3fb950">0.9</text>
  </g>
  
  <!-- Bottom explanation -->
  <g transform="translate(100, 370)">
    <text class="text-main" x="0" y="0" font-weight="bold">为什么需要 Causal Mask？</text>
    
    <text class="text-small" x="0" y="30">1. <tspan font-weight="bold">训练时</tspan>：使用 teacher forcing，decoder 输入是整个右移的目标序列</text>
    <text class="text-tiny" x="25" y="50">   一次前向传播同时计算所有位置的预测</text>
    
    <text class="text-small" x="0" y="75">2. <tspan font-weight="bold">但模拟推理行为</tspan>：位置 t 预测时，只能依赖 &lt; t 的已生成 token</text>
    <text class="text-tiny" x="25" y="95">   如果让 t 看到未来的 token，就是作弊（信息泄露）</text>
    
    <text class="text-small" x="0" y="120">3. <tspan font-weight="bold">Causal mask 实现</tspan>：</text>
    <text class="text-tiny" x="25" y="140" font-family="monospace">mask = torch.triu(torch.ones(L, L), diagonal=1).bool()</text>
    <text class="text-tiny" x="25" y="160" font-family="monospace">scores = scores.masked_fill(mask, float('-inf'))</text>
    <text class="text-tiny" x="25" y="180">softmax(-∞) → 0，被 mask 的位置权重归零</text>
    
    <text class="text-small" x="0" y="210">4. <tspan font-weight="bold">推理时</tspan>：自回归生成，每步只生成一个 token，天然满足因果性</text>
    <text class="text-tiny" x="25" y="230">   但训练必须用 mask 模拟这个约束，否则训练-推理不一致</text>
  </g>
  
  <!-- Legend -->
  <rect x="50" y="650" width="20" height="20" class="cell-allowed border"/>
  <text class="text-tiny" x="80" y="665">允许 attend（下三角 + 对角线）</text>
  
  <rect x="350" y="650" width="20" height="20" class="cell-masked border"/>
  <text class="text-tiny" x="380" y="665">masked（上三角，设为 -∞）</text>
</svg>
