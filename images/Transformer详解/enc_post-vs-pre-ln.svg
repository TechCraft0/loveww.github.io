<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" fill="#2d333b"/>
  <style>
    text {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif !important;
    }
  </style>

  <text x="450" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#cdd9e5" text-anchor="middle" font-weight="bold">Post-LN vs Pre-LN：LayerNorm 在 Block 里的真实位置</text>

  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="380" height="450" rx="16" fill="#252b33" stroke="#4b5563" stroke-width="1.2"/>
    <text x="190" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#388bfd" text-anchor="middle" font-weight="bold">Post-LN（原论文 block）</text>
    <text x="190" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#768390" text-anchor="middle">先 Add，再做 LayerNorm</text>

    <text x="92" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#768390" text-anchor="middle">残差主路径</text>
    <text x="280" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#768390" text-anchor="middle">子层支路</text>

    <rect x="70" y="96" width="120" height="34" rx="4" fill="#768390" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="130" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#f0f6fc" text-anchor="middle">x</text>

    <path d="M 130 130 V 184" stroke="#adbac7" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 130 148 H 220" stroke="#f0883e" stroke-width="2.2" fill="none" stroke-dasharray="5,4"/>

    <rect x="220" y="130" width="120" height="36" rx="4" fill="#3fb950" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="280" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">Multi-Head Attn</text>
    <path d="M 280 166 V 196 H 144" stroke="#adbac7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <circle cx="130" cy="197" r="14" fill="#f0883e" stroke="#cdd9e5" stroke-width="1.5"/>
    <text x="130" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#1b1f24" text-anchor="middle" font-weight="bold">+</text>

    <path d="M 130 211 V 225" stroke="#adbac7" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="70" y="225" width="120" height="34" rx="4" fill="#a371f7" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="130" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">LayerNorm</text>

    <path d="M 130 259 V 313" stroke="#adbac7" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 130 277 H 220" stroke="#f0883e" stroke-width="2.2" fill="none" stroke-dasharray="5,4"/>

    <rect x="220" y="259" width="120" height="36" rx="4" fill="#3fb950" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="280" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">FFN</text>
    <path d="M 280 295 V 326 H 144" stroke="#adbac7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <circle cx="130" cy="327" r="14" fill="#f0883e" stroke="#cdd9e5" stroke-width="1.5"/>
    <text x="130" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#1b1f24" text-anchor="middle" font-weight="bold">+</text>

    <path d="M 130 341 V 355" stroke="#adbac7" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="70" y="355" width="120" height="34" rx="4" fill="#a371f7" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="130" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">LayerNorm</text>

    <path d="M 130 389 V 403" stroke="#adbac7" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="70" y="403" width="120" height="30" rx="4" fill="#388bfd" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="130" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle" font-weight="bold">y</text>

    <text x="206" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#cdd9e5">h' = LN(x + MHA(x))</text>
    <text x="206" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#cdd9e5">y = LN(h' + FFN(h'))</text>

    <text x="20" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#768390">主路径每层都会经过归一化。</text>
    <text x="20" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#f69d50">深层时通常更依赖 warmup、初始化和学习率配方。</text>
  </g>

  <g transform="translate(480, 70)">
    <rect x="0" y="0" width="380" height="450" rx="16" fill="#252b33" stroke="#4b5563" stroke-width="1.2"/>
    <text x="190" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#3fb950" text-anchor="middle" font-weight="bold">Pre-LN（现代常见 block）</text>
    <text x="190" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#768390" text-anchor="middle">先 LayerNorm，再进子层，再 Add</text>

    <text x="92" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#768390" text-anchor="middle">残差主路径</text>
    <text x="280" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#768390" text-anchor="middle">子层支路</text>

    <rect x="70" y="96" width="120" height="34" rx="4" fill="#768390" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="130" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#f0f6fc" text-anchor="middle">x</text>

    <path d="M 130 130 V 314" stroke="#adbac7" stroke-width="3" fill="none"/>
    <path d="M 130 148 H 220" stroke="#f0883e" stroke-width="2.2" fill="none" stroke-dasharray="5,4"/>

    <rect x="220" y="130" width="120" height="32" rx="4" fill="#a371f7" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="280" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">LayerNorm</text>
    <path d="M 280 162 V 176" stroke="#adbac7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <rect x="220" y="176" width="120" height="36" rx="4" fill="#3fb950" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="280" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">Multi-Head Attn</text>
    <path d="M 280 212 V 223 H 144" stroke="#adbac7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <circle cx="130" cy="224" r="14" fill="#f0883e" stroke="#cdd9e5" stroke-width="1.5"/>
    <text x="130" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#1b1f24" text-anchor="middle" font-weight="bold">+</text>

    <path d="M 130 238 V 314" stroke="#adbac7" stroke-width="3" fill="none"/>
    <path d="M 130 271 H 220" stroke="#f0883e" stroke-width="2.2" fill="none" stroke-dasharray="5,4"/>

    <rect x="220" y="253" width="120" height="32" rx="4" fill="#a371f7" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="280" y="273" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">LayerNorm</text>
    <path d="M 280 285 V 299" stroke="#adbac7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <rect x="220" y="299" width="120" height="36" rx="4" fill="#3fb950" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="280" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle">FFN</text>
    <path d="M 280 335 V 354 H 144" stroke="#adbac7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <circle cx="130" cy="355" r="14" fill="#f0883e" stroke="#cdd9e5" stroke-width="1.5"/>
    <text x="130" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#1b1f24" text-anchor="middle" font-weight="bold">+</text>

    <path d="M 130 369 V 403" stroke="#adbac7" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="70" y="403" width="120" height="30" rx="4" fill="#388bfd" stroke="#cdd9e5" stroke-width="1.2"/>
    <text x="130" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#1b1f24" text-anchor="middle" font-weight="bold">y</text>

    <text x="206" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#cdd9e5">h' = x + MHA(LN(x))</text>
    <text x="206" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#cdd9e5">y = h' + FFN(LN(h'))</text>

    <text x="20" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#768390">LN 只作用在子层输入，主路径更接近 identity。</text>
    <text x="20" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#56d364">深层训练通常更稳定，但不代表完全不需要 warmup。</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#adbac7"/>
    </marker>
  </defs>
</svg>
