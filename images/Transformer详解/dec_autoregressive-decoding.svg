  <rect class="bg" width="1000" height="980"/>

  <text class="text-main" x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold">Autoregressive Decoding（自回归生成）</text>
  <text class="text-small" x="500" y="52" text-anchor="middle">prefix 在语义上不断变长；真正送进 decoder 的只有最新 token，历史 K/V 从 cache 读取</text>
  <text class="text-tiny" x="500" y="71" text-anchor="middle">真实系统通常先做 prompt prefill；这里为了突出 decode 阶段，只画逐 token 生成</text>

