    <text class="mono text-tiny" x="45" y="24" text-anchor="middle">&lt;BOS&gt; The</text>
    <text class="mono text-tiny" x="45" y="38" text-anchor="middle">cat sat</text>
    <text class="text-tiny" x="45" y="68" text-anchor="middle">prefix</text>

    <path class="arrow" d="M 45 50 L 45 76"/>
    <rect class="box-gray" x="15" y="82" width="60" height="24" rx="4"/>
    <text class="mono text-tiny" x="45" y="98" text-anchor="middle">sat</text>
    <text class="text-tiny" x="45" y="78" text-anchor="middle">input_t</text>

    <path class="arrow" d="M 45 106 L 45 128"/>
    <rect class="box" x="0" y="128" width="90" height="38" rx="4"/>
    <text class="text-tiny" x="45" y="146" text-anchor="middle">Decoder</text>
    <text class="text-tiny" x="45" y="160" text-anchor="middle">只算最新 token</text>

    <text class="text-tiny" x="116" y="123" text-anchor="middle">cache in</text>
    <rect class="box-red" x="96" y="126" width="48" height="42" rx="4"/>
    <text class="mono text-tiny" x="120" y="144" text-anchor="middle">BOS..</text>
    <text class="mono text-tiny" x="120" y="158" text-anchor="middle">cat</text>
    <path class="arrow-red" d="M 94 147 L 90 147"/>
    <text class="mono text-tiny" x="120" y="184" text-anchor="middle" fill="#f85149">+ KV(sat)</text>

    <path class="arrow" d="M 45 166 L 45 188"/>
    <rect class="box-green" x="0" y="188" width="90" height="30" rx="4"/>
    <text class="text-tiny" x="45" y="208" text-anchor="middle">LM head + sample</text>

    <path class="arrow" d="M 45 218 L 45 238"/>
    <rect class="box-orange" x="15" y="238" width="60" height="25" rx="4"/>
    <text class="mono text-tiny" x="45" y="255" text-anchor="middle" font-weight="bold">...</text>
  </g>

  <g transform="translate(800, 102)">
    <text class="text-small" x="0" y="0" font-weight="bold">直到</text>
    <rect class="box-purple" x="0" y="10" width="110" height="40" rx="4"/>
    <text class="mono text-tiny" x="55" y="27" text-anchor="middle">long prefix</text>
    <text class="mono text-tiny" x="55" y="42" text-anchor="middle">... last token</text>
    <text class="text-tiny" x="55" y="68" text-anchor="middle">prefix</text>

    <path class="arrow" d="M 55 50 L 55 76"/>
    <rect class="box-gray" x="25" y="82" width="60" height="24" rx="4"/>
    <text class="mono text-tiny" x="55" y="98" text-anchor="middle">last</text>
    <text class="text-tiny" x="55" y="78" text-anchor="middle">input_t</text>

    <path class="arrow" d="M 55 106 L 55 128"/>
    <rect class="box" x="10" y="128" width="90" height="38" rx="4"/>
    <text class="text-tiny" x="55" y="146" text-anchor="middle">Decoder</text>
    <text class="text-tiny" x="55" y="160" text-anchor="middle">只算最新 token</text>

    <text class="text-tiny" x="125" y="123" text-anchor="middle">cache in</text>
    <rect class="box-red" x="105" y="126" width="48" height="42" rx="4"/>
    <text class="mono text-tiny" x="129" y="144" text-anchor="middle">all</text>
    <text class="mono text-tiny" x="129" y="158" text-anchor="middle">prev</text>
    <path class="arrow-red" d="M 103 147 L 100 147"/>

    <path class="arrow" d="M 55 166 L 55 188"/>
    <rect class="box-green" x="10" y="188" width="90" height="30" rx="4"/>
    <text class="text-tiny" x="55" y="208" text-anchor="middle">LM head + sample</text>

    <path class="arrow" d="M 55 218 L 55 238"/>
    <rect class="box-orange" x="25" y="238" width="60" height="25" rx="4"/>
    <text class="mono text-tiny" x="55" y="255" text-anchor="middle" font-weight="bold">&lt;EOS&gt;</text>
  </g>

  <text class="text-tiny" x="500" y="392" text-anchor="middle">红色虚线框是历史 KV cache 的示意；每一步结束后，把当前 input_t 的 K/V 追加进去</text>

  <g transform="translate(40, 430)">
    <text class="text-main" x="0" y="0" font-weight="bold">KV Cache 优化</text>

    <text class="text-small" x="0" y="28">问题：如果没有 cache，第 t 步要把长度 t 的前缀整段重跑，旧 token 会被重复前向很多次</text>

    <text class="text-small" x="0" y="56" font-weight="bold" fill="#3fb950">做法：缓存历史 token 已经算过的 K / V</text>
    <text class="text-tiny" x="18" y="80">• Step t：只为最新 token 计算新的 K_t、V_t 和隐藏状态</text>
    <text class="text-tiny" x="18" y="100">• Attention 直接读取 cached {K_0...K_{t-1}, V_0...V_{t-1}}</text>
    <text class="text-tiny" x="18" y="120">• 所以 cache 省掉的是重复前向；解码本身仍然是逐步串行</text>

    <text class="text-small" x="0" y="152" font-weight="bold" fill="#f0883e">代价：显存</text>
    <text class="text-tiny mono" x="18" y="176">bytes ≈ layers × kv_heads × seq_len × d_head × 2 × dtype_bytes</text>
    <text class="text-tiny" x="18" y="196">• 标准 MHA 里 kv_heads = num_heads；GQA / MQA 本质是在减 kv_heads</text>
    <text class="text-tiny" x="18" y="216">• 例：6 × 8 × 2048 × 64 × 2 × 2B ≈ 24MB / request（FP16）</text>
    <text class="text-tiny" x="18" y="236">• batch_size = 32 时约 768MB，长上下文会迅速放大这部分占用</text>

    <text class="text-small" x="0" y="270" font-weight="bold">解码策略</text>
    <rect class="panel-green" x="0" y="282" width="910" height="126" rx="8"/>

    <text class="text-small" x="18" y="308" font-weight="bold">1. Greedy：</text>
    <text class="text-tiny" x="38" y="328">每步取最大概率 token，稳定但容易重复</text>

    <text class="text-small" x="18" y="354" font-weight="bold">2. Beam Search：</text>
    <text class="text-tiny" x="38" y="374">维护 k 条候选路径，更常见于翻译 / ASR；开放式生成里未必划算</text>

    <text class="text-small" x="470" y="308" font-weight="bold">3. Sampling（采样）：</text>
    <text class="text-tiny" x="490" y="328">• Temperature：调节分布温度</text>
    <text class="text-tiny" x="490" y="348">• Top-k / Top-p：限制候选集合后再采样</text>
    <text class="text-tiny" x="490" y="368">• 只影响“怎么从 logits 里选 token”，不改变上面的 autoregressive 主流程</text>
  </g>

  <g transform="translate(40, 880)">
    <text class="text-main" x="0" y="0" font-weight="bold">训练 vs 推理</text>
    <text class="text-small" x="0" y="26" font-weight="bold">训练（Teacher Forcing）：</text>
    <text class="text-tiny" x="20" y="46">输入完整右移序列，并行计算所有位置 loss，用 causal mask 模拟自回归</text>

    <text class="text-small" x="500" y="26" font-weight="bold">推理（Autoregressive）：</text>
    <text class="text-tiny" x="520" y="46">顺序生成；每步只新增一个 token，并从 KV cache 读取历史</text>

    <text class="text-tiny" x="0" y="74" fill="#f85149">Gap：训练见到完美前缀，推理见到的是自己刚采样出来的前缀（exposure bias）</text>
  </g>
</svg>
