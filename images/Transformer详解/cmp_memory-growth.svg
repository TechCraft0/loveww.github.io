<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="ui-monospace,monospace" font-size="12">
  <rect width="720" height="400" fill="#2d333b"/>
  <text x="360" y="28" text-anchor="middle" fill="#adbac7" font-size="16">不同序列长度下 attention 矩阵显存（fp16，1 head）</text>
  <g stroke="#444c56" stroke-width="1">
    <line x1="80" y1="350" x2="680" y2="350"/>
    <line x1="80" y1="60" x2="80" y2="350"/>
  </g>
  <g fill="#adbac7" font-size="11">
    <text x="100" y="370" text-anchor="middle">2k</text>
    <text x="220" y="370" text-anchor="middle">8k</text>
    <text x="340" y="370" text-anchor="middle">32k</text>
    <text x="460" y="370" text-anchor="middle">128k</text>
    <text x="580" y="370" text-anchor="middle">512k</text>
    <text x="660" y="370" text-anchor="middle">1M</text>
  </g>
  <text x="380" y="392" text-anchor="middle" fill="#adbac7">序列长度 n</text>
  <text x="40" y="200" fill="#adbac7" transform="rotate(-90 40 200)">attn matrix 显存</text>
  <g font-size="11">
    <rect x="92" y="345" width="20" height="5" fill="#3fb950"/>
    <text x="120" y="350" fill="#adbac7">8 MB</text>
    <rect x="212" y="330" width="20" height="20" fill="#3fb950"/>
    <text x="240" y="335" fill="#adbac7">128 MB</text>
    <rect x="332" y="280" width="20" height="70" fill="#f0883e"/>
    <text x="360" y="285" fill="#adbac7">2 GB</text>
    <rect x="452" y="170" width="20" height="180" fill="#f85149"/>
    <text x="480" y="175" fill="#adbac7">32 GB</text>
    <rect x="572" y="80" width="20" height="270" fill="#f85149"/>
    <text x="600" y="85" fill="#adbac7">512 GB（爆）</text>
    <rect x="652" y="65" width="20" height="285" fill="#f85149"/>
    <text x="630" y="62" fill="#f85149">2 TB（不可能）</text>
  </g>
  <text x="100" y="100" fill="#768390" font-size="11">显存 = n²·2 字节 / head</text>
  <text x="100" y="118" fill="#768390" font-size="11">实际还要 ×head 数 ×batch</text>
  <text x="100" y="136" fill="#768390" font-size="11">这是为什么必须 FlashAttn 或稀疏</text>
</svg>
